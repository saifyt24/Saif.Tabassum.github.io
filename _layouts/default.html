<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <script>
    (function () {
      try {
        const saved = localStorage.getItem("theme");
        const theme = saved || "dark";
        document.documentElement.dataset.theme =
          theme === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      Saif Tabassum<span class="brand-dot">.</span>
    </a>

    <button
      class="menu-toggle"
      id="menu-toggle"
      type="button"
      aria-label="Open navigation menu"
      aria-expanded="false"
      aria-controls="site-nav">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <a href="{{ '/projects/' | relative_url }}">Projects</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/experiments/' | relative_url }}">Experiments</a>
      <a href="{{ '/resume/' | relative_url }}">Resume</a>
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
      <button class="theme-toggle" id="theme-toggle" type="button">
        <span id="theme-label">Light mode</span>
      </button>
    </nav>
  </header>

  <main class="page-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>© {{ 'now' | date: '%Y' }} Saif Tabassum</p>
  </footer>

  <script>
    (function () {
      const menuButton = document.getElementById("menu-toggle");
      const nav = document.getElementById("site-nav");
      const themeButton = document.getElementById("theme-toggle");
      const themeLabel = document.getElementById("theme-label");

      function updateThemeLabel() {
        const isLight = document.documentElement.dataset.theme === "light";
        themeLabel.textContent = isLight ? "Dark mode" : "Light mode";
      }

      updateThemeLabel();

      themeButton.addEventListener("click", function () {
        const current = document.documentElement.dataset.theme;
        const next = current === "light" ? "dark" : "light";
        document.documentElement.dataset.theme = next;

        try {
          localStorage.setItem("theme", next);
        } catch (e) {}

        updateThemeLabel();
      });

      menuButton.addEventListener("click", function () {
        const isOpen = menuButton.getAttribute("aria-expanded") === "true";
        menuButton.setAttribute("aria-expanded", String(!isOpen));
        menuButton.setAttribute(
          "aria-label",
          isOpen ? "Open navigation menu" : "Close navigation menu"
        );
        nav.classList.toggle("is-open", !isOpen);
      });

      nav.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () {
          nav.classList.remove("is-open");
          menuButton.setAttribute("aria-expanded", "false");
          menuButton.setAttribute("aria-label", "Open navigation menu");
        });
      });
    })();
  </script>
</body>
</html>
