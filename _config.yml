title: "Saif Tabassum"
description: "Portfolio, projects, writing, and experiments."
url: "https://saifyt24.github.io"
baseurl: "/Saif.Tabassum.github.io"

markdown: kramdown
permalink: /writing/:title/

collections:
  projects:
    output: true
    permalink: /work/:name/
  experiments:
    output: true
    permalink: /experiments/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: default
  - scope:
      path: ""
      type: experiments
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
