media:
  - name: images
    input: images
    output: /images

  - name: resume
    input: resume
    output: /resume
    extensions:
      - pdf

content:
  - name: projects
    label: Projects
    type: collection
    path: _projects
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      primary: title
      fields:
        - title
        - description
        - featured
    fields:
      - name: title
        label: Project Title
        type: string
        required: true

      - name: description
        label: Description
        type: text

      - name: image
        label: Project Image
        type: image
        required: false

      - name: tags
        label: Tags
        type: string
        list: true

      - name: featured
        label: Feature on Homepage
        type: boolean

      - name: published
        label: Published
        type: boolean

      - name: body
        label: Project Details
        type: rich-text
        required: false

      - name: resources
        label: Project File
        type: object
        list: true
        fields:
          - name: label
            label: Resource Name
            type: string

          - name: file
            label: Uploaded File
            type: file

          - name: url
            label: External Link
            type: string

          - name: preview
            label: Document Preview Image
            type: image
            required: false

  - name: experiments
    label: Experiments
    type: collection
    path: _experiments
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      primary: title
      fields:
        - title
        - description
        - status
        - featured
    fields:
      - name: title
        label: Experiment Title
        type: string
        required: true

      - name: description
        label: Description
        type: text

      - name: status
        label: Status
        type: string

      - name: image
        label: Image
        type: image
        required: false

      - name: tags
        label: Tags
        type: string
        list: true

      - name: published
        label: Published
        type: boolean

      - name: featured
        label: Feature on Homepage
        type: boolean

      - name: body
        label: Details
        type: rich-text
        required: false

  - name: posts
    label: Blog
    type: collection
    path: _posts
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: title
    format: yaml-frontmatter
    view:
      primary: title
      fields:
        - title
        - date
        - published
        - featured
      sort:
        - date
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Article Title
        type: string
        required: true

      - name: date
        label: Publication Date
        type: date
        required: true

      - name: description
        label: Short Summary
        type: text

      - name: tags
        label: Tags
        type: string
        list: true

      - name: published
        label: Published
        type: boolean

      - name: featured
        label: Feature on Homepage
        type: boolean

      - name: body
        label: Article Content
        type: rich-text

  - name: employment
    label: Employment Record
    type: collection
    path: _employment
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      primary: job_title
      fields:
        - job_title
        - company
        - record_category
        - start_date
        - end_date
      sort:
        - start_date
      default:
        sort: start_date
        order: desc
    fields:
      - name: job_title
        label: Job Title or Volunteer Role
        type: string
        required: true

      - name: company
        label: Company, Organization, or Employer
        type: string
        required: true

      - name: record_category
        label: Record Category
        type: select
        required: true
        options:
          values:
            - Relevant Employment
            - Short-term Employment
            - Volunteering

      - name: employment_type
        label: Employment Type
        type: string

      - name: location
        label: Location
        type: string

      - name: start_date
        label: Start Date
        type: date
        required: true

      - name: end_date
        label: End Date
        type: date

      - name: current
        label: Currently Employed
        type: boolean

      - name: description
        label: Job Description or Volunteer Summary
        type: text
        required: true

      - name: responsibilities
        label: Responsibilities and Achievements
        type: string
        list: true

      - name: reason_for_leaving
        label: Reason for Leaving
        type: text

      - name: company_website
        label: Organization Website
        type: string

      - name: supporting_document
        label: Supporting Document (Optional)
        type: file
        required: false
        options:
          extensions:
            - pdf

      - name: body
        label: Additional Notes
        type: rich-text

  - name: resume
    label: Resume
    type: file
    path: _data/resume.yml
    format: yaml
    fields:
      - name: file
        label: Resume PDF
        type: file
        required: true
        options:
          media: resume
          extensions:
            - pdf
          rename: false
