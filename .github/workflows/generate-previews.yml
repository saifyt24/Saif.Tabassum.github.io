
name: Generate Document Previews

on:
  push:
    paths:
      - 'content/projects/**'
      - 'images/*.pdf'
      - 'images/*.xlsx'
      - 'images/*.xls'
      - 'images/*.docx'
      - 'images/*.doc'
      - 'images/*.pptx'
      - 'images/*.ppt'
      - 'images/*.odt'
      - 'images/*.ods'
      - 'images/**/*.pdf'
      - 'images/**/*.xlsx'
      - 'images/**/*.xls'
      - 'images/**/*.docx'
      - 'images/**/*.doc'
      - 'images/**/*.pptx'
      - 'images/**/*.ppt'
      - 'images/**/*.odt'
      - 'images/**/*.ods'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils

      - name: Generate previews
        run: python3 scripts/generate_previews.py

      - name: Save generated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/previews
          if ! git diff --cached --quiet; then
            git commit -m "Generate document previews"
            git push
          fi
